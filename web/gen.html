<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOCHfabrik Studio — Generator</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .out{min-height:340px;display:grid;place-items:center;text-align:center}
  .out img{max-width:100%;border-radius:var(--radius);
    border:6px solid var(--gold);background:#fff}
  .ph{color:var(--ink-soft);font-size:.92rem;padding:40px 16px}
  .ph.err{color:#a8324b;font-weight:600}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid
    var(--gold);border-top-color:transparent;border-radius:50%;
    animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .meta{margin-top:12px;font-size:.82rem;color:var(--ink-soft)}
  .dlbtn{display:inline-block;margin-top:14px;background:var(--gold);
    color:#fff;text-decoration:none;border-radius:var(--radius-s);
    padding:11px 24px;font-weight:700}
  .dlbtn:hover{background:var(--gold-deep)}
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-logo"><a href="index.html"><img src="assets/kochfabrik-logo.png" alt="KOCHfabrik Studio"></a></div>
    <nav class="side-nav">
      <div class="nav-label">Arbeiten</div>
      <a class="nav-item" href="index.html"><span class="ic">&#9632;</span> Dashboard</a>
      <a class="nav-item" href="chat.html"><span class="ic">&#9993;</span> Angebotsgenerator</a>
      <a class="nav-item active" href="bildgenerator.html"><span class="ic">&#9788;</span> Bildgenerator</a>
      <div class="nav-label">Wissen</div>
      <a class="nav-item" href="client.html"><span class="ic">&#9906;</span> Client Research</a>
      <a class="nav-item" href="bibliothek.html"><span class="ic">&#9783;</span> Bibliothek</a>
    </nav>
    <div class="side-foot">
      <div class="avatar">PD</div>
      <div><div class="nm">Patrick Diehr</div><div class="rl">KOCHfabrik</div></div>
    </div>
  </aside>

  <main class="view">
    <div class="topbar">
      <div><h1 id="ttl">Generator</h1><div class="sub" id="sub">&nbsp;</div></div>
      <div class="tb-actions">
        <a class="btn btn-ghost btn-sm" href="bildgenerator.html">&larr; Kategorien</a>
        <a class="btn btn-ghost btn-sm" href="#" id="logout">Abmelden</a>
      </div>
    </div>

    <div class="content">
      <div class="gen-grid">

        <div class="panel r r1">
          <div class="field">
            <label>Motiv / Beschreibung</label>
            <textarea id="p" rows="6" placeholder="Beschreib das Motiv …"></textarea>
          </div>
          <div class="field" id="tableField" style="display:none">
            <label>Hintergrund</label>
            <label style="display:flex;align-items:center;gap:9px;
              font-size:.88rem;font-weight:600;color:var(--ink);
              text-transform:none;letter-spacing:0;cursor:pointer">
              <input type="checkbox" id="table" checked>
              KOCHfabrik-Tisch als Referenz
            </label>
            <div style="font-size:.78rem;color:var(--ink-soft);margin-top:7px">
              Aus = freier, zum Motiv passender Kontext.</div>
          </div>
          <button class="btn btn-primary" id="go" style="width:100%;justify-content:center">Bild generieren</button>
          <div id="model" style="font-size:.78rem;color:var(--ink-soft);margin-top:12px;text-align:center"></div>
          <div class="field" style="margin:20px 0 0">
            <label>Beispiele</label>
            <div class="chips" id="chips"></div>
          </div>
        </div>

        <div class="panel r r2">
          <div class="out" id="out">
            <div class="ph">Noch kein Bild — Motiv eingeben und generieren.</div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script>
const Q = new URLSearchParams(location.search);
const CAT = Q.get('cat') || 'food';
const $ = id => document.getElementById(id);
const STEPS = ["Motiv wird komponiert…","Fotorealistische Texturen…",
  "Natürliches Licht & Schärfentiefe…","Komposition & Details…",
  "Finalisiere 2K-Shot…"];
let timer=null;

fetch('/api/cats').then(r=>r.json()).then(d=>{
  const c = d.cats.find(x=>x.key===CAT);
  if(!c){location.href='bildgenerator.html';return;}
  document.title='KOCHfabrik Studio — '+c.label;
  $('ttl').textContent=c.label;
  $('sub').textContent=c.hint;
  $('p').placeholder='z.B. '+(c.chips[0]||'…');
  if(c.table){$('tableField').style.display='';}
  const ch=$('chips');
  c.chips.forEach(t=>{const s=document.createElement('span');
    s.className='chip';s.textContent=t;
    s.onclick=()=>{$('p').value=t;};ch.appendChild(s);});
}).catch(()=>{$('ttl').textContent='Generator';});

fetch('/api/health').then(r=>r.json()).then(d=>{
  $('model').textContent='Modell: '+d.model+(d.key?'':' · ⚠ kein API-Key');
}).catch(()=>{});

$('go').onclick=async()=>{
  const prompt=$('p').value.trim(), out=$('out');
  if(!prompt){out.innerHTML='<div class="ph err">Bitte Motiv eingeben.</div>';return;}
  $('go').disabled=true;const t0=Date.now();
  const tableEl=$('table');
  const table = $('tableField').style.display!=='none' && tableEl.checked;
  const render=()=>{const s=(Date.now()-t0)/1000;
    const st=STEPS[Math.min(STEPS.length-1,Math.floor(s/5))];
    out.innerHTML='<div class="ph"><span class="spin"></span>'+st+
      '<div class="meta">'+s.toFixed(0)+' s · fotorealistisch, 2K — '+
      'das dauert ~15–30 s</div></div>';};
  render();timer=setInterval(render,1000);
  try{
    const r=await fetch('/api/image',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,table,category:CAT})});
    if(r.status===401){location.href='/login.html';return;}
    const d=await r.json();clearInterval(timer);
    if(d.image){
      const fn='kochfabrik_'+CAT+'_'+Date.now()+'.png';
      out.innerHTML='<div><img src="'+d.image+'" alt="">'+
        '<div><a class="dlbtn" href="'+d.image+'" download="'+fn+'">'+
        '&#11015; Bild herunterladen</a></div>'+
        '<div class="meta">'+((Date.now()-t0)/1000).toFixed(1)+' s · '+
        d.model+(d.bg?(' · Tisch: '+d.bg):' · freier Kontext')+'</div></div>';
    } else {
      out.innerHTML='<div class="ph err">Fehler: '+
        (d.error||'unbekannt')+'</div>';
    }
  }catch(e){clearInterval(timer);
    out.innerHTML='<div class="ph err">Netzwerkfehler: '+e+'</div>';}
  $('go').disabled=false;
};

$('logout').onclick=async(e)=>{e.preventDefault();
  await fetch('/api/logout',{method:'POST'});location.href='/login.html';};
</script>
</body>
</html>
